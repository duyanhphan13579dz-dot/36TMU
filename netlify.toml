# Netlify Configuration for 36TMU (Ban Liên Lạc Sinh Viên Thanh Hóa TMU)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback: Chuyển hướng toàn bộ route về index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Thiết lập Header an toàn & tối ưu Cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
